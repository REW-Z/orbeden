<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Orbeden · 图标设计</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font-family:Arial,"Microsoft YaHei",sans-serif}main{max-width:1040px;margin:auto;padding:56px 32px}header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:40px}h1{font-size:30px;letter-spacing:-1px;margin:0}header span{font-size:12px;letter-spacing:2px}.pair{display:grid;grid-template-columns:1fr 1fr;border:1px solid #000}.tile{aspect-ratio:1;display:grid;place-items:center}.tile img{width:60%;height:60%}.dark{background:#000}.sizes{display:flex;align-items:end;gap:40px;padding:36px 0;border-bottom:1px solid #000}.sizes div{display:flex;flex-direction:column;align-items:center;gap:16px}.sizes span{font-size:11px}p{font-size:14px;line-height:1.9;max-width:640px;margin-top:28px}@media(max-width:560px){main{padding:28px 20px}.sizes{gap:24px}header{display:block}header span{display:block;margin-top:12px}}</style><main><header><h1>orbeden</h1><span>ORB + EDEN</span></header><div class="pair"><div class="tile"><img src="orbeden-icon.svg" alt="黑色图标"></div><div class="tile dark"><img src="orbeden-icon-white.svg" alt="白色图标"></div></div><div class="sizes"><div><img src="orbeden-icon.svg" width="16" height="16" alt="Orbeden 16px"><span>16 px</span></div><div><img src="orbeden-icon.svg" width="24" height="24" alt="Orbeden 24px"><span>24 px</span></div><div><img src="orbeden-icon.svg" width="32" height="32" alt="Orbeden 32px"><span>32 px</span></div><div><img src="orbeden-icon.svg" width="48" height="48" alt="Orbeden 48px"><span>48 px</span></div><div><img src="orbeden-icon.svg" width="64" height="64" alt="Orbeden 64px"><span>64 px</span></div></div><p>圆环代表 orb，也呼应首字母 o；右上方的叶片代表 eden。舒展的弧形叶缘、尖叶梢和逐渐收细的留白主叶脉，让叶片更容易识别。圆心留空，保留球体的完整感。</p></main></html>
